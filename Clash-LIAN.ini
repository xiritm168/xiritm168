; ===========================================
; 1. 基础与地区策略组 (自动测速，挑选该地区最快节点)
; ===========================================

; 全量手动选择 (想用特定节点就进这里选)
custom_proxy_group=✈️ 手动选择`select`[]^.*$

; 自动选择 (排除无效节点)
custom_proxy_group=♻️ 自动选择`url-test`[]^(?!.*(电信|联通|移动|官网|剩余|到期)).*`http://www.gstatic.com/generate_204`300,5,50

; 地区分组 (自动优选该地区节点)
custom_proxy_group=🇭🇰 香港节点`url-test`[](HK|Hong Kong|🇭🇰|HongKong|广港)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 台湾节点`url-test`[](TW|Tai Wan|🇹🇼|TaiWan|Taiwan|广台|新北)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 日本节点`url-test`[](JP|Japan|🇯🇵|东京|大阪|埼玉|广日)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`[](SG|Singapore|🇸🇬|狮城|广新)`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇸 美国节点`url-test`[](US|United States|🇺🇸|America|洛杉矶)`http://www.gstatic.com/generate_204`300,5,50

; ===========================================
; 2. 功能策略组 (引用上面的地区组)
; ===========================================

; 下面的组，你可以单独指定走“美国”、“香港”或“自动”
; 比如：把“👽 AI”选为“🇺🇸 美国节点”，把“📺 流媒体”选为“🇸🇬 新加坡节点”

custom_proxy_group=🎮 FCM推送`select`DIRECT,♻️ 自动选择,🇺🇸 美国节点,🇭🇰 香港节点,✈️ 手动选择
custom_proxy_group=📢 WIFI calling`select`DIRECT,♻️ 自动选择,🇺🇸 美国节点,🇭🇰 香港节点,✈️ 手动选择
custom_proxy_group=👽 AI`select`🇺🇸 美国节点,🇯🇵 日本节点,🇸🇬 新加坡节点,♻️ 自动选择,✈️ 手动选择
custom_proxy_group=👯‍♂️ 社交`select`🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,♻️ 自动选择,✈️ 手动选择
custom_proxy_group=📘 GitHub`select`DIRECT,♻️ 自动选择,🇭🇰 香港节点,🇺🇸 美国节点,✈️ 手动选择
custom_proxy_group=🛸 谷歌服务`select`DIRECT,♻️ 自动选择,🇭🇰 香港节点,🇺🇸 美国节点,✈️ 手动选择
